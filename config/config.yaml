# -----------------------------------------------------------------
# Configuration file for CreatePoN and AVANTseq snakemake pipelines
# -----------------------------------------------------------------

# Working directory for all input/output files and results.
work_dir: "your_working_directory"  
# Replace with the absolute path where your project data and results will be stored.

# Reference genome paths:
ref_bwa: "/your_path/genomes/Hsapiens/hg38/bwa/hg38.fa"   # FASTA file used for BWA indexing and alignment.
ref_fa: "/your_path/genomes/Hsapiens/hg38/seq/hg38.fa"  # Reference genome FASTA file used for variant calling and other tools.

# Coverage-related files for metrics and target regions:
bed: "/your_path/Covered_hg38.bed"  # BED file defining regions covered by sequencing.
baits: "/your_path/Baits_hg38.interval_list"  # Interval list of baited regions used in capture (used by GATK and Picard).
targets: "/your_path/Targets_hg38.interval_list"  # Interval list of target regions used in capture (used by GATK and Picard).

# Panel of Normals (PoN) and germline resource files for Mutect2:
pon: "/your_path/somatic-hg38-1000g_pon.hg38.vcf.gz"  # Public Panel of Normals VCF from 1000 Genomes or similar resource.
merged_pon: "/your_path/merged_pon.vcf.gz"  # Your custom PoN merged with public PoN, used for filtering recurrent artifacts (generated by the CreatePoN.smk pipeline).
germline_resource: "/your_path/af-only-gnomad.hg38.vcf.gz"  # VCF with known germline allele frequencies to help Mutect2 distinguish somatic variants.
vcf_exac: "/your_path/small_exac_common_3.hg38.vcf"  # Common variants from ExAC used for annotation or filtering.

# Funcotator data source directory (for variant annotation):
data_source: "/your_path/funcotator_dataSources.v1.8.hg38.20230908s"  # Directory containing reference data used by GATK Funcotator for variant annotation.
